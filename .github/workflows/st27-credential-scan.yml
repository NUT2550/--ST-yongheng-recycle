name: ST-27 Credential Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: st27-credscan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-scan:
    name: Scan for embedded database credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/security/scan-credentials.mjs
      - run: bun test tests/st27-credential-scan.test.ts
